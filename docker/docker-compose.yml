services:
  universal-lookup:
    build:
      context: ..
      dockerfile: Dockerfile
    # image: ghcr.io/bluscream/universal-lookup:latest
    container_name: universal-lookup
    restart: unless-stopped
    ports:
      - "24010:24010"
    volumes:
      - lookup-data:/app/data
    environment:
      - PORT=24010
      - LOG_LEVEL=info
      - CACHE_TTL=86400
      - CACHE_TTL_PARCEL=3600
      - PROVIDER_TIMEOUT=10000
      - UNIVERSAL_RESULTS_LIMIT=3
      - PHONE_COUNTRY_PREFIX=0049
      - PHONE_LOCAL_PREFIX=6131
      - PROVIDERS_TEL=emergency,fritzbox,tellows,dastelefonbuch,11880,dasoertliche,google,bing,duckduckgo,yahoo
      - PROVIDERS_DOMAIN=whois,dns,subdomain,google,bing,duckduckgo,yahoo
      - PROVIDERS_IP=ip-api.com,ip-api.io,ip-api.io/risk,maxmind,whois,dns,ping,traceroute,portscan,subdomain,google,bing,duckduckgo,yahoo
      - PROVIDERS_EMAIL=dns,ip-api.io/email,ip-api.io/email-advanced,ip-api.io/risk,google,bing,duckduckgo,yahoo
      - PROVIDERS_LOCATION=nominatim,google-maps,google,bing,duckduckgo,yahoo
      - PROVIDERS_PARCEL=dhl-web,dhl,parcelsapp,google,bing,duckduckgo,yahoo
      - PROVIDERS_WEB=google,bing,duckduckgo,yahoo
      - PROVIDERS_STEAM=playerdb,steam-xml,steam-api,steam-inventory
      - PROVIDERS_URL=dns-lookup,ip-info,metadata,urlscan,virustotal
      # Forward API keys and credentials from host environment:
      - STEAM_API_KEY
      - VIRUSTOTAL_API_KEY
      - URLSCAN_API_KEY
      # Uncomment and fill in other API keys if not set in host env:
      # - IP_API_COM_KEY=
      # - IP_API_IO_KEY=
      # - TELLOWS_API_KEY=
      # - MAXMIND_LICENSE_KEY=
      # - GOOGLE_API_KEY=
      # - GOOGLE_SEARCH_CX=
      # - PARCELSAPP_API_KEY=
      # - FRITZBOX_HOST=fritz.box
      # - FRITZBOX_USER=
      # - FRITZBOX_PASS=
      # - REQUIRE_TOKEN=my-secret-token
      # - DISABLE_RAW=false
      # - DISABLE_FRESH=false
      # - RATE_LIMIT_MAX=100
      # - RATE_LIMIT_WINDOW=1 minute

volumes:
  lookup-data:
    driver: local
