services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: universal-lookup-backend
    restart: unless-stopped
    ports:
      - "24011:24011"
    env_file:
      - ../.env
    volumes:
      - lookup-data:/app/backend/data
    environment:
      # Container-specific overrides
      - DB_PATH=/app/backend/data/cache.db
      - MAXMIND_DB_PATH=/app/backend/data/maxmind
      - PORT=24011
      - HOST=0.0.0.0
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      
      # Additional default settings (if not in .env)
      - PROVIDERS_APK=googleplay,aptoide,apkpure,apkmirror,evozi,apkcombo,apkpremier,apkdl,apksupport

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: universal-lookup-frontend
    restart: unless-stopped
    ports:
      - "24010:24010"
    environment:
      - PORT=24010
      - HOST=0.0.0.0
      - VITE_BACKEND_URL=http://backend:24011
    depends_on:
      - backend

volumes:
  lookup-data:
    driver: local
