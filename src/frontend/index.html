<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Universal Lookup - Aggregated lookup service for phone numbers, IP addresses, emails, locations, and parcel tracking">
  <title>Universal Lookup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <span class="nav-icon">🔍</span>
      <span class="nav-title">Universal Lookup</span>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link active">Home</a>
      <a href="/docs" class="nav-link">API Docs</a>
      <a href="https://github.com/Bluscream/universal-lookup" class="nav-link" target="_blank" rel="noopener">GitHub</a>
    </div>
  </nav>

  <main class="main-container">
    <header class="hero">
      <h1 class="hero-title">
        <span class="gradient-text">Universal Lookup</span>
      </h1>
      <p class="hero-subtitle">Aggregated intelligence from multiple sources — phone numbers, IPs, emails, locations, and parcels.</p>
    </header>

    <section class="search-section">
      <form id="lookup-form" class="search-form">
        <div class="form-row">
          <div class="select-wrapper">
            <select id="lookup-type" class="form-select" aria-label="Lookup type">
              <option value="ip">🌐 IP / Domain</option>
              <option value="tel">📞 Phone Number</option>
              <option value="email">📧 Email</option>
              <option value="location">📍 Location</option>
              <option value="parcel">📦 Parcel</option>
            </select>
          </div>
          <div class="input-wrapper">
            <input type="text" id="lookup-query" class="form-input" placeholder="Enter IP, domain, phone, email..." autocomplete="off" spellcheck="false" aria-label="Query">
            <button type="submit" id="lookup-btn" class="form-button" aria-label="Search">
              <span class="btn-text">Search</span>
              <span class="btn-spinner hidden">
                <svg class="spinner" viewBox="0 0 24 24" role="img" aria-label="Loading"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="30 70"></circle></svg>
              </span>
            </button>
          </div>
        </div>
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="opt-raw" class="form-checkbox">
            <span class="checkmark"></span>
            Include raw responses
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-fresh" class="form-checkbox">
            <span class="checkmark"></span>
            Force fresh lookup
          </label>
        </div>
      </form>
    </section>

    <section id="results-section" class="results-section hidden">
      <div class="results-header">
        <h2 class="results-title">Results</h2>
        <div class="results-meta">
          <span id="result-time" class="meta-badge"></span>
          <span id="result-type" class="meta-badge"></span>
          <span id="result-cached" class="meta-badge cached hidden">cached</span>
        </div>
      </div>

      <div id="result-error" class="error-banner hidden"></div>

      <div id="result-cards" class="result-cards"></div>

      <details class="json-details">
        <summary class="json-summary">Full JSON Response</summary>
        <pre id="result-json" class="json-viewer"><code></code></pre>
      </details>

      <div id="result-errors" class="errors-section hidden">
        <h3 class="errors-title">⚠ Provider Errors</h3>
        <div id="errors-list" class="errors-list"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Universal Lookup &copy; 2026</span>
    <span class="footer-sep">·</span>
    <a href="/docs">API Docs</a>
    <span class="footer-sep">·</span>
    <a href="https://github.com/Bluscream/universal-lookup" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
